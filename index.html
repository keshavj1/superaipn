<!doctype html>
<!-- <html lang="en" style="scroll-behavior: smooth;" class="lenis lenis-scrolling lenis-smooth"> -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    // Apply saved theme before paint to avoid a flash of the wrong theme
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.backgroundColor = t === 'light' ? '#f4f5fa' : '#05060a';
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <!-- Local, not https://superaip.com/img/... — an external favicon is a
       cross-origin request that breaks in dev and if that host is down. -->
  <link rel="icon" type="image/png" href="/assets/super_aip_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Super AI Polaris — Sovereign AI platforms for education, enterprises, and governments. Powering the future with artificial intelligence." />
  <link rel="canonical" href="https://superaip.com/" />

  <!-- Open Graph / Twitter: without these, links shared to LinkedIn or
       WhatsApp render with no title, description or image. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Super AI Polaris" />
  <meta property="og:title" content="Super AI Polaris — Sovereign AI Platform" />
  <meta property="og:description"
    content="Sovereign AI platforms for education, enterprises, and governments. Built in India, deployable on-premise." />
  <meta property="og:url" content="https://superaip.com/" />
  <meta property="og:image" content="https://superaip.com/assets/super_aip_logo.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Super AI Polaris — Sovereign AI Platform" />
  <meta name="twitter:description"
    content="Sovereign AI platforms for education, enterprises, and governments. Built in India, deployable on-premise." />
  <meta name="twitter:image" content="https://superaip.com/assets/super_aip_logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- One Inter request, not two. The second stylesheet loaded the same family
       as a variable font, duplicating a render-blocking round trip. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <!-- Font Awesome removed: grep for "fa-" across src/ returned zero matches,
       so this was a render-blocking stylesheet for icons never used. -->
  <title>Super AI Polaris — Sovereign AI Platform</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
