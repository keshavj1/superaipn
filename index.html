<!doctype html>
<!-- <html lang="en" style="scroll-behavior: smooth;" class="lenis lenis-scrolling lenis-smooth"> -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    /* Apply the theme before first paint so there is no flash of the wrong one.

       The site is currently locked to dark (SHOW_THEME_TOGGLE = false in
       Navbar.jsx). This script used to read localStorage regardless, so a
       visitor who had saved "light" before the toggle was removed got a white
       #f4f5fa background painted here — then a jarring correction to dark once
       React mounted and forced the theme back. Reading the saved value only
       matters when the toggle actually exists; flip both together. */
    (function () {
      var THEME_TOGGLE_ENABLED = false;
      var t = 'dark';
      try {
        if (THEME_TOGGLE_ENABLED) t = localStorage.getItem('theme') || 'dark';
      } catch (e) { /* private mode / blocked storage — keep the default */ }
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.backgroundColor = t === 'light' ? '#f4f5fa' : '#05060a';
      /* Scroll-reveal CSS hides sections only under html.js, so content is
         never invisible for visitors (or crawlers) without JavaScript. */
      document.documentElement.classList.add('js');
    })();
  </script>
  <!-- Local, not https://superaip.com/img/... — an external favicon is a
       cross-origin request that breaks in dev and if that host is down. -->
  <link rel="icon" type="image/png" href="/assets/super_aip_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Colours the mobile browser chrome to match the locked dark UI. -->
  <meta name="theme-color" content="#05060a" />
  <!-- Explicit default for non-JS crawlers; PageMeta re-asserts per route (and
       sets noindex on 404s) for JS-capable ones. -->
  <meta name="robots" content="index, follow" />
  <meta name="description"
    content="Super AI Polaris — Sovereign AI platforms for education, enterprises, and governments. Powering the future with artificial intelligence." />
  <link rel="canonical" href="https://superaip.com/" />

  <!-- Open Graph / Twitter: without these, links shared to LinkedIn or
       WhatsApp render with no title, description or image. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Super AI Polaris" />
  <meta property="og:title" content="Super AI Polaris — Sovereign AI Platform" />
  <meta property="og:description"
    content="Sovereign AI platforms for education, enterprises, and governments. Built in India, deployable on-premise." />
  <meta property="og:url" content="https://superaip.com/" />
  <meta property="og:image" content="https://superaip.com/assets/super_aip_logo.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Super AI Polaris — Sovereign AI Platform" />
  <meta name="twitter:description"
    content="Sovereign AI platforms for education, enterprises, and governments. Built in India, deployable on-premise." />
  <meta name="twitter:image" content="https://superaip.com/assets/super_aip_logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- One Inter request, not two. The second stylesheet loaded the same family
       as a variable font, duplicating a render-blocking round trip. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <!-- Font Awesome removed: grep for "fa-" across src/ returned zero matches,
       so this was a render-blocking stylesheet for icons never used. -->
  <title>Super AI Polaris — Sovereign AI Platform</title>

  <!-- Organization + WebSite structured data. Static in the HTML (not injected
       by React) so crawlers that don't run JS still get it. This is the one
       piece of SEO metadata that reaches non-JS bots regardless of the SPA. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://superaip.com/#organization",
        "name": "Super AI Polaris",
        "alternateName": "Super AIP",
        "url": "https://superaip.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://superaip.com/assets/super_aip_logo.png"
        },
        "description": "Sovereign AI platforms for education, enterprises, and governments. Built in India, deployable on-premise or air-gapped."
      },
      {
        "@type": "WebSite",
        "@id": "https://superaip.com/#website",
        "url": "https://superaip.com/",
        "name": "Super AI Polaris",
        "publisher": { "@id": "https://superaip.com/#organization" },
        "inLanguage": "en"
      }
    ]
  }
  </script>

  <!-- Meta Pixel Code -->
  <!-- Base pixel: init + first PageView fire here, before the React bundle,
       so window.fbq exists for every later call. Route changes inside the SPA
       don't reload this page — PixelTracker.jsx tracks those PageViews, and
       ThankYou.jsx fires the CompleteRegistration conversion event. -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '980553611569814');
    fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=980553611569814&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
